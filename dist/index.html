<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>排球教练战术板</title>
<style>
:root{--bg:#0b1218;--panel:#121d25;--panel2:#16242e;--line:#29414d;--text:#e9f1f4;--muted:#8fa6b2;--accent:#ff8a3d;--cyan:#5fe0d2;--yellow:#ffd66b;--red:#ff667c;--green:#77e596;--shadow:0 16px 40px rgba(0,0,0,.25)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#1b303b 0,#0b1218 44%);color:var(--text);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:#182933;border-radius:8px;padding:8px 12px;transition:.2s ease}button:hover{border-color:#4e7180;background:#203844}button.primary{background:var(--accent);border-color:var(--accent);color:#22150c;font-weight:700}button.ghost{background:transparent}button.icon{padding:7px 9px}
.app{display:grid;grid-template-columns:260px minmax(520px,1fr) 310px;grid-template-rows:auto 1fr 150px;min-height:100vh;gap:12px;padding:14px}.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#ffb76f);display:grid;place-items:center;color:#22150c;font-weight:900;font-size:18px;box-shadow:0 6px 20px rgba(255,138,61,.35)}.brand h1{font-size:18px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;align-items:center}.save-state{font-size:12px;color:var(--green);margin-right:8px}.panel{background:linear-gradient(180deg,rgba(22,36,46,.96),rgba(14,25,33,.96));border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:15px 16px 11px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(65,95,107,.34)}.panel-head h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#cfe2e8;margin:0}.panel-body{padding:12px 14px}.left{grid-column:1;grid-row:2/3}.center{grid-column:2;grid-row:2/3;display:flex;flex-direction:column;min-width:0}.right{grid-column:3;grid-row:2/3}.timeline{grid-column:1/-1;grid-row:3;display:flex;flex-direction:column}.stack{display:flex;flex-direction:column;gap:10px}.section-label{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin:3px 0}.player-list{display:flex;flex-direction:column;gap:7px;max-height:355px;overflow:auto;padding-right:3px}.player-row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:9px;padding:8px 8px;border:1px solid transparent;border-radius:10px;background:rgba(26,43,53,.65)}.player-row.active{border-color:var(--accent);background:rgba(255,138,61,.1)}.player-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#101a1f;border:2px solid rgba(255,255,255,.35)}.player-name{font-weight:700;font-size:13px}.player-meta{font-size:11px;color:var(--muted);margin-top:1px}.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 7px;border-radius:999px;background:#223742;color:#bdd0d7}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}.field input,.field select{width:100%;background:#0c171e;border:1px solid var(--line);border-radius:8px;padding:8px 9px;outline:none}.field input:focus,.field select:focus{border-color:var(--accent)}.inline{display:flex;gap:8px;align-items:center}.inline>*{flex:1}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.canvas-wrap{position:relative;flex:1;min-height:480px;padding:16px;display:flex;align-items:center;justify-content:center}.court-shell{width:min(100%,740px);aspect-ratio:1.72/1;position:relative}.court-svg{width:100%;height:100%;display:block;border-radius:16px;filter:drop-shadow(0 18px 28px rgba(0,0,0,.32))}.court-bg{fill:#1d6a6a}.court-line{stroke:rgba(238,255,252,.8);stroke-width:1.3;fill:none}.court-mid{stroke:#ebf8ee;stroke-width:2.2}.court-zone{fill:rgba(8,31,38,.1);stroke:rgba(239,255,250,.55);stroke-width:1}.court-label{fill:rgba(238,255,252,.7);font-size:3.8px;letter-spacing:.15em}.player-node{cursor:grab}.player-node:active{cursor:grabbing}.player-node circle{stroke:#fff;stroke-width:1.2}.player-node text{font-size:4px;font-weight:800;fill:#102128;pointer-events:none;text-anchor:middle;dominant-baseline:middle}.route{fill:none;stroke-width:1.5;stroke-dasharray:3 2;opacity:.88}.route.cyan{stroke:var(--cyan)}.route.orange{stroke:var(--accent)}.route.yellow{stroke:var(--yellow)}.route.red{stroke:var(--red)}.arrowhead{fill:currentColor}.selected-ring{fill:none;stroke:#fff;stroke-width:1;stroke-dasharray:2 1;opacity:.9}.court-overlay{position:absolute;top:26px;left:28px;right:28px;display:flex;justify-content:space-between;pointer-events:none}.overlay-chip{background:rgba(7,16,21,.74);border:1px solid rgba(168,213,221,.24);border-radius:8px;padding:6px 8px;font-size:11px;color:#cbe0e6}.view-switch{display:flex;gap:4px;background:#0d1a21;border:1px solid var(--line);border-radius:9px;padding:3px;pointer-events:auto}.view-switch button{border:0;background:transparent;padding:5px 8px;font-size:11px}.view-switch button.active{background:#274550;color:#fff}.center-footer{padding:10px 15px 14px;border-top:1px solid rgba(65,95,107,.34);display:flex;justify-content:space-between;align-items:center;gap:12px}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px}.legend span{display:flex;align-items:center;gap:5px}.legend i{display:inline-block;width:10px;height:3px;border-radius:3px}.right .panel-body{display:flex;flex-direction:column;gap:13px}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat-card{padding:10px;border:1px solid var(--line);border-radius:9px;background:rgba(8,18,24,.38)}.stat-card small{display:block;color:var(--muted);font-size:11px}.stat-card strong{font-size:20px;display:block;margin-top:2px}.action-list{display:flex;flex-direction:column;gap:6px}.action-row{display:grid;grid-template-columns:8px 1fr auto;gap:8px;align-items:center;padding:8px 9px;background:rgba(8,18,24,.38);border:1px solid var(--line);border-radius:8px}.action-bar{height:26px;width:4px;border-radius:3px}.action-title{font-weight:700;font-size:12px}.action-meta{font-size:11px;color:var(--muted)}.progress-wrap{display:flex;align-items:center;gap:10px}.progress{height:7px;flex:1;background:#0b161c;border:1px solid var(--line);border-radius:99px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),#ffd66b);width:42%;transition:width .1s linear}.timecode{font-variant-numeric:tabular-nums;font-size:12px;color:#d7e6ea;min-width:60px;text-align:right}.timeline .panel-body{padding:10px 14px 13px}.scene-row{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.scene{min-width:154px;display:flex;flex-direction:column;gap:6px;padding:10px;background:#101e26;border:1px solid var(--line);border-radius:10px;position:relative}.scene.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(255,138,61,.2)}.scene-top{display:flex;justify-content:space-between;align-items:center}.scene-name{font-weight:700;font-size:12px}.scene-time{font-size:11px;color:var(--muted)}.scene-summary{display:flex;gap:4px;flex-wrap:wrap}.scene-tag{font-size:10px;padding:3px 5px;background:#223742;border-radius:5px;color:#b7d1d8}.scene-actions{display:flex;justify-content:flex-end;gap:5px}.scene-actions button{padding:4px 6px;font-size:11px}.add-scene{min-width:140px;border:1px dashed #42626d;background:transparent;color:#b5cbd1;display:grid;place-items:center;gap:4px}.add-scene strong{font-size:20px;color:var(--accent)}.timeline-tools{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px}.timeline-tools .hint{font-size:11px;color:var(--muted)}.compare-drawer{position:fixed;inset:0;background:rgba(2,7,10,.72);display:none;align-items:flex-end;justify-content:center;z-index:20}.compare-drawer.open{display:flex}.compare-card{width:min(960px,94vw);margin-bottom:18px;background:#12212a;border:1px solid #3a5b66;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.5);padding:18px}.compare-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.compare-item{background:#0c171e;border:1px solid var(--line);padding:12px;border-radius:10px}.compare-item h3{margin:0 0 8px;font-size:13px}.compare-stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(63,93,102,.3);font-size:12px}.compare-stat:last-child{border-bottom:0}.toast{position:fixed;bottom:18px;right:18px;padding:11px 14px;border-radius:9px;background:#203b43;color:#efffff;border:1px solid #4c8185;box-shadow:var(--shadow);transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.show{transform:translateY(0);opacity:1}.muted{color:var(--muted)}
@media(max-width:1100px){.app{grid-template-columns:220px minmax(420px,1fr);grid-template-rows:auto auto auto 150px}.right{grid-column:1/-1;grid-row:3}.timeline{grid-row:4}.left{grid-row:2}.center{grid-row:2}.right .panel-body{display:grid;grid-template-columns:1fr 1fr}.right .panel-head{display:flex}}
@media(max-width:760px){.app{display:flex;flex-direction:column;padding:10px}.topbar{flex-wrap:wrap;gap:10px}.left,.center,.right,.timeline{min-height:auto}.canvas-wrap{min-height:390px}.right .panel-body{display:flex}.player-list{max-height:none}.timeline{order:5}.center{order:2}.left{order:3}.right{order:4}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="brand-mark">VB</div><div><h1>排球教练战术板</h1><p>站位 · 跑位 · 动作 · 动画预览</p></div></div><div class="top-actions"><span class="save-state" id="saveState">已自动保存</span><button class="ghost" id="newPlanBtn">新建方案</button><button class="ghost" id="compareBtn">对比方案</button><button class="primary" id="saveBtn">保存方案</button></div></header>
<section class="panel left"><div class="panel-head"><h2>球员与站位</h2><button class="icon" id="addPlayerBtn">＋</button></div><div class="panel-body stack"><div class="inline"><select id="planSelect" style="flex:1"></select><button class="icon" id="duplicateBtn" title="复制方案">⧉</button></div><div class="section-label">场上球员</div><div class="player-list" id="playerList"></div><div class="section-label">选中球员</div><div class="form-grid"><div class="field"><label>编号</label><input id="playerNumber" /></div><div class="field"><label>角色</label><select id="playerRole"><option>主攻</option><option>副攻</option><option>二传</option><option>接应</option><option>自由人</option></select></div><div class="field full"><label>姓名</label><input id="playerName" /></div><div class="field"><label>颜色</label><input id="playerColor" type="color" /></div><div class="field"><label>标签</label><input id="playerTag" placeholder="如：一传核心" /></div></div><button id="applyPlayerBtn">更新球员信息</button></div></section>
<section class="panel center"><div class="panel-head"><div><h2>战术画布</h2><div class="muted" id="sceneSubtitle">场景 1 · 初始站位</div></div><div class="toolbar"><button id="resetViewBtn" class="ghost">重置视图</button><button id="clearRoutesBtn" class="ghost">隐藏轨迹</button></div></div><div class="canvas-wrap"><div class="court-shell" id="courtShell"><svg class="court-svg" id="court" viewBox="0 0 100 58" aria-label="排球场战术画布"><defs><linearGradient id="courtGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26807b"/><stop offset="1" stop-color="#14555b"/></linearGradient><marker id="arrowCyan" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#5fe0d2"/></marker><marker id="arrowOrange" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#ff8a3d"/></marker><marker id="arrowYellow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#ffd66b"/></marker></defs><rect x="0" y="0" width="100" height="58" rx="2" fill="url(#courtGrad)"/><rect x="5" y="4" width="90" height="50" rx="1" fill="rgba(0,0,0,.06)" stroke="rgba(238,255,252,.8)" stroke-width="1.3"/><rect x="5" y="4" width="45" height="50" class="court-zone"/><rect x="50" y="4" width="45" height="50" class="court-zone"/><line x1="50" y1="4" x2="50" y2="54" class="court-mid"/><line x1="35" y1="4" x2="35" y2="54" class="court-line"/><line x1="65" y1="4" x2="65" y2="54" class="court-line"/><line x1="5" y1="19" x2="35" y2="19" class="court-line"/><line x1="65" y1="19" x2="95" y2="19" class="court-line"/><text x="7" y="8" class="court-label">接发区</text><text x="72" y="8" class="court-label">进攻区</text><g id="routeLayer"></g><g id="playerLayer"></g></svg><div class="court-overlay"><div class="overlay-chip" id="overlayScene">场景 1 / 4</div><div class="view-switch"><button class="active" data-view="top">俯视</button><button data-view="flat">平面</button><button data-view="depth">3D 预览</button></div></div></div></div><div class="center-footer"><div class="legend"><span><i style="background:var(--cyan)"></i>接发移动</span><span><i style="background:var(--accent)"></i>进攻跑位</span><span><i style="background:var(--yellow)"></i>传球线路</span><span><i style="background:var(--red)"></i>扣球方向</span></div><span class="muted" id="dragHint">拖动圆点调整站位</span></div></section>
<section class="panel right"><div class="panel-head"><h2>动作与预览</h2><span class="pill" id="playModePill">自动播放</span></div><div class="panel-body"><div class="stat-grid"><div class="stat-card"><small>当前方案</small><strong id="planNameStat">接发转攻</strong></div><div class="stat-card"><small>总时长</small><strong id="durationStat">8.0s</strong></div><div class="stat-card"><small>场景数量</small><strong id="sceneCountStat">4</strong></div><div class="stat-card"><small>参与球员</small><strong id="playerCountStat">6</strong></div></div><div><div class="section-label">动作序列</div><div class="action-list" id="actionList"></div></div><div><div class="progress-wrap"><button class="primary icon" id="playBtn">▶</button><button class="ghost icon" id="stepBackBtn">◀</button><button class="ghost icon" id="stepForwardBtn">▶</button><div class="progress"><div id="progressBar"></div></div><div class="timecode" id="timecode">00:00.0</div></div><div class="inline" style="margin-top:9px"><span class="muted" style="font-size:11px">播放速度</span><select id="speedSelect"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button id="loopBtn" class="ghost">循环：开</button></div></div><div><div class="section-label">当前动作</div><div class="form-grid"><div class="field"><label>动作类型</label><select id="actionType"><option>接发</option><option>二传</option><option>扣球</option><option>拦网</option><option>发球</option><option>防守</option></select></div><div class="field"><label>持续时间（秒）</label><input id="actionDuration" type="number" min="0.5" max="8" step="0.5" value="2.0" /></div><div class="field full"><label>战术说明</label><input id="actionNote" placeholder="如：四号位拉开，二传背飞" /></div></div><button id="applyActionBtn">更新当前场景动作</button></div></div></section>
<section class="panel timeline"><div class="panel-head"><div><h2>场景时间线</h2><div class="muted">每个场景保存一组球员坐标与动作</div></div><div class="toolbar"><button id="copySceneBtn" class="ghost">复制当前场景</button><button id="addSceneBtn" class="primary">＋ 新增场景</button></div></div><div class="panel-body"><div class="timeline-tools"><span class="hint" id="timelineHint">点击场景切换编辑，拖动球员后会自动更新跑位</span><span class="pill" id="currentActionPill">当前：接发</span></div><div class="scene-row" id="sceneRow"></div></div></section>
</div>
<div class="compare-drawer" id="compareDrawer"><div class="compare-card"><div class="compare-head"><div><h2 style="margin:0;font-size:16px">方案对比</h2><div class="muted">快速查看不同方案的节奏与跑位密度</div></div><button class="icon" id="closeCompareBtn">×</button></div><div class="compare-grid" id="compareGrid"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const storageKey='volleyball-coach-plans-v1';
const colors=['#ffb04b','#5fe0d2','#ffd66b','#ff7b8d','#9c8cff','#77e596','#f28cda'];
const actionColors={'接发':'#5fe0d2','二传':'#ffd66b','扣球':'#ff667c','拦网':'#9c8cff','发球':'#ff8a3d','防守':'#77e596'};
let state={plans:[],activePlanId:null,activeScene:0,selectedPlayer:0,playing:false,elapsed:0,speed:1,loop:true,showRoutes:true,view:'top'};
const $=s=>document.querySelector(s);
function uid(prefix='id'){return prefix+'_'+Math.random().toString(36).slice(2,9)}
function deepClone(o){return JSON.parse(JSON.stringify(o))}
function defaultPlan(name='接发转攻'){
 const players=[['1','林浩','主攻','#ffb04b','四号位'],['2','周扬','二传','#ffd66b','组织核心'],['3','陈默','副攻','#5fe0d2','快攻点'],['4','李琦','接应','#ff7b8d','二号位'],['5','唐宁','自由人','#9c8cff','一传核心'],['6','赵启','主攻','#77e596','后排保障']].map((p,i)=>({id:'p'+(i+1),number:p[0],name:p[1],role:p[2],color:p[3],tag:p[4]}));
 const base=[[18,31],[41,27],[31,15],[73,15],[17,47],[42,45]];
 const scenes=[
  {id:uid('scene'),name:'初始站位',duration:1.5,action:'接发',note:'自由人居中，主攻前后交叉',positions:base.map(([x,y])=>({x,y}))},
  {id:uid('scene'),name:'一传到位',duration:2.0,action:'接发',note:'二传前移到网口，四号位拉开',positions:base.map(([x,y],i)=>({x:x+[4,-3,2,0,3,4][i],y:y+[-4,0,3,2,-2,-1][i]}))},
  {id:uid('scene'),name:'二传组织',duration:1.5,action:'二传',note:'二传背传，副攻短平快启动',positions:base.map(([x,y],i)=>({x:x+[9,6,4,-2,6,8][i],y:y+[-5,-3,2,1,-1,-2][i]}))},
  {id:uid('scene'),name:'四号位扣球',duration:3.0,action:'扣球',note:'主攻沿斜线助跑完成扣球',positions:base.map(([x,y],i)=>({x:x+[18,8,8,-1,10,14][i],y:y+[-9,-2,-1,1,-4,-5][i]}))}
 ];
 return {id:uid('plan'),name,updated:new Date().toISOString(),players,scenes};
}
function ensureState(){try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&saved.plans?.length){state.plans=saved.plans;state.activePlanId=saved.activePlanId||saved.plans[0].id;return}}catch(e){} const p=defaultPlan();state.plans=[p];state.activePlanId=p.id;persist()}
function activePlan(){return state.plans.find(p=>p.id===state.activePlanId)||state.plans[0]}
function activeScene(){return activePlan().scenes[state.activeScene]||activePlan().scenes[0]}
function persist(){localStorage.setItem(storageKey,JSON.stringify({plans:state.plans,activePlanId:state.activePlanId}));$('#saveState').textContent='已自动保存 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),1800)}
function renderAll(){renderPlanSelect();renderPlayers();renderCourt();renderScenes();renderActions();renderStats();renderForm();}
function renderPlanSelect(){const sel=$('#planSelect');sel.innerHTML=state.plans.map(p=>`<option value="${p.id}" ${p.id===state.activePlanId?'selected':''}>${p.name}</option>`).join('')}
function renderPlayers(){const p=activePlan();const scene=activeScene();$('#playerList').innerHTML=p.players.map((pl,i)=>`<div class="player-row ${i===state.selectedPlayer?'active':''}" data-index="${i}"><div class="player-dot" style="background:${pl.color}">${pl.number}</div><div><div class="player-name">${pl.name}</div><div class="player-meta">${pl.role} · ${pl.tag||'未标注'}</div></div><span class="pill">${Math.round(scene.positions[i].x)},${Math.round(scene.positions[i].y)}</span></div>`).join('');document.querySelectorAll('.player-row').forEach(el=>el.onclick=()=>{state.selectedPlayer=+el.dataset.index;renderPlayers();renderForm();renderCourt()})}
function renderForm(){const pl=activePlan().players[state.selectedPlayer];if(!pl)return;$('#playerNumber').value=pl.number;$('#playerName').value=pl.name;$('#playerRole').value=pl.role;$('#playerColor').value=pl.color;$('#playerTag').value=pl.tag||'';const sc=activeScene();$('#actionType').value=sc.action;$('#actionDuration').value=sc.duration;$('#actionNote').value=sc.note||'';$('#currentActionPill').textContent='当前：'+sc.action}
function renderCourt(){const p=activePlan(),sc=activeScene();$('#sceneSubtitle').textContent=`场景 ${state.activeScene+1} · ${sc.name}`;$('#overlayScene').textContent=`场景 ${state.activeScene+1} / ${p.scenes.length}`;const routeLayer=$('#routeLayer');routeLayer.innerHTML='';if(state.showRoutes){p.players.forEach((pl,i)=>{const pts=p.scenes.slice(0,state.activeScene+1).map(s=>s.positions[i]);if(pts.length<2)return;const path=pts.map((pt,j)=>`${j?'L':'M'} ${pt.x} ${pt.y}`).join(' ');const cls=i%3===0?'cyan':i%3===1?'orange':'yellow';routeLayer.innerHTML+=`<path d="${path}" class="route ${cls}" marker-end="url(#arrow${cls==='cyan'?'Cyan':cls==='orange'?'Orange':'Yellow'})"/>`})}
 $('#playerLayer').innerHTML=p.players.map((pl,i)=>{const pos=sc.positions[i];const sel=i===state.selectedPlayer;return `<g class="player-node" data-index="${i}" transform="translate(${pos.x} ${pos.y})"><circle r="3.3" fill="${pl.color}"/><circle r="4.6" class="selected-ring" style="display:${sel?'block':'none'}"/><text y=".2">${pl.number}</text></g>`}).join('');document.querySelectorAll('.player-node').forEach(node=>{node.addEventListener('pointerdown',startDrag)})}
function renderScenes(){const p=activePlan();const row=$('#sceneRow');row.innerHTML=p.scenes.map((s,i)=>`<div class="scene ${i===state.activeScene?'active':''}" data-scene="${i}"><div class="scene-top"><span class="scene-name">${i+1}. ${s.name}</span><span class="scene-time">${s.duration.toFixed(1)}s</span></div><div class="scene-summary"><span class="scene-tag" style="color:${actionColors[s.action]}">${s.action}</span><span class="scene-tag">${p.players.length}人</span></div><div class="scene-actions"><button data-act="rename">重命名</button><button data-act="delete">删除</button></div></div>`).join('')+`<button class="scene add-scene" id="addSceneInline"><strong>＋</strong><span>添加后续跑位</span></button>`;document.querySelectorAll('.scene[data-scene]').forEach(el=>{el.onclick=(e)=>{if(e.target.closest('button'))return;state.activeScene=+el.dataset.scene;state.elapsed=0;renderAll()};el.querySelector('[data-act="rename"]').onclick=()=>{const n=prompt('场景名称',p.scenes[+el.dataset.scene].name);if(n){p.scenes[+el.dataset.scene].name=n;persist();renderAll()}};el.querySelector('[data-act="delete"]').onclick=()=>{if(p.scenes.length<=1)return toast('至少保留一个场景');p.scenes.splice(+el.dataset.scene,1);state.activeScene=Math.max(0,state.activeScene-1);persist();renderAll()}});$('#addSceneInline').onclick=addScene}
function renderActions(){const p=activePlan();$('#actionList').innerHTML=p.scenes.map((s,i)=>`<div class="action-row" style="opacity:${i===state.activeScene?1:.72}"><div class="action-bar" style="background:${actionColors[s.action]||'#7aa'}"></div><div><div class="action-title">${s.action} · ${s.name}</div><div class="action-meta">${s.note||'未添加战术说明'}</div></div><span class="action-meta">${s.duration.toFixed(1)}s</span></div>`).join('')}
function renderStats(){const p=activePlan();const dur=p.scenes.reduce((a,s)=>a+s.duration,0);$('#planNameStat').textContent=p.name;$('#durationStat').textContent=dur.toFixed(1)+'s';$('#sceneCountStat').textContent=p.scenes.length;$('#playerCountStat').textContent=p.players.length}
function addScene(){const p=activePlan(),prev=p.scenes[state.activeScene];const positions=prev.positions.map((pt,i)=>({x:Math.min(90,pt.x+(i%2?4:7)),y:Math.max(8,Math.min(50,pt.y+(i%3-1)*4))}));p.scenes.splice(state.activeScene+1,0,{id:uid('scene'),name:'新跑位 '+(p.scenes.length+1),duration:1.5,action:'防守',note:'拖动球员编辑新场景',positions});state.activeScene++;state.elapsed=0;persist();renderAll();toast('已添加后续跑位场景')}
function startDrag(e){e.preventDefault();const node=e.currentTarget;const idx=+node.dataset.index;state.selectedPlayer=idx;const svg=$('#court');const move=ev=>{const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const m=svg.getScreenCTM().inverse();const p=m.matrixTransform(pt);const sc=activeScene();sc.positions[idx].x=Math.max(7,Math.min(93,p.x));sc.positions[idx].y=Math.max(6,Math.min(52,p.y));renderCourt();renderPlayers();};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);persist();renderScenes();renderStats();toast('站位已更新，跑位路径已重算')};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)}
function totalDuration(){return activePlan().scenes.reduce((a,s)=>a+s.duration,0)}
function sceneAtTime(t){let acc=0;for(let i=0;i<activePlan().scenes.length;i++){const s=activePlan().scenes[i];if(t<=acc+s.duration)return {i,local:(t-acc)/s.duration};acc+=s.duration}return {i:activePlan().scenes.length-1,local:1}}
function renderPlayback(){const total=totalDuration();if(total<=0)return;const info=sceneAtTime(state.elapsed);if(info.i!==state.activeScene){state.activeScene=info.i;renderAll()}const sc=activeScene(),prev=activePlan().scenes[Math.max(0,state.activeScene-1)]||sc;const t=info.local;const positions=sc.positions.map((pt,i)=>{const from=state.activeScene===0?pt:prev.positions[i];return {x:from.x+(pt.x-from.x)*t,y:from.y+(pt.y-from.y)*t}});const p=activePlan();$('#playerLayer').innerHTML=p.players.map((pl,i)=>{const pos=positions[i],sel=i===state.selectedPlayer;return `<g class="player-node" transform="translate(${pos.x} ${pos.y})"><circle r="3.3" fill="${pl.color}"/><circle r="4.6" class="selected-ring" style="display:${sel?'block':'none'}"/><text y=".2">${pl.number}</text></g>`}).join('');const pct=state.elapsed/total*100;$('#progressBar').style.width=pct+'%';const m=Math.floor(state.elapsed/60).toString().padStart(2,'0');const s=(state.elapsed%60).toFixed(1).padStart(4,'0');$('#timecode').textContent=`${m}:${s}`}
function tick(ts){if(!window.__lastTs)window.__lastTs=ts;const dt=(ts-window.__lastTs)/1000;window.__lastTs=ts;if(state.playing){state.elapsed+=dt*state.speed;if(state.elapsed>totalDuration()){if(state.loop)state.elapsed=0;else{state.elapsed=totalDuration();state.playing=false;$('#playBtn').textContent='▶'}}renderPlayback()}requestAnimationFrame(tick)}
function applyPlayer(){const p=activePlan().players[state.selectedPlayer];if(!p)return;p.number=$('#playerNumber').value.trim()||p.number;p.name=$('#playerName').value.trim()||p.name;p.role=$('#playerRole').value;p.color=$('#playerColor').value;p.tag=$('#playerTag').value.trim();persist();renderAll();toast('球员信息已更新')}
function applyAction(){const s=activeScene();s.action=$('#actionType').value;s.duration=Math.max(.5,Math.min(8,parseFloat($('#actionDuration').value)||1));s.note=$('#actionNote').value.trim();persist();renderAll();toast('动作与时间已更新')}
function newPlan(){const n=prompt('新方案名称','我的新战术');if(!n)return;const p=defaultPlan(n);state.plans.unshift(p);state.activePlanId=p.id;state.activeScene=0;persist();renderAll();toast('已创建新方案')}
function duplicatePlan(){const p=deepClone(activePlan());p.id=uid('plan');p.name=p.name+' · 副本';p.updated=new Date().toISOString();state.plans.unshift(p);state.activePlanId=p.id;state.activeScene=0;persist();renderAll();toast('已复制方案')}
function comparePlans(){const active=activePlan();const others=state.plans.filter(p=>p.id!==active.id).slice(0,3);const list=[active,...others];$('#compareGrid').innerHTML=list.map(p=>{const d=p.scenes.reduce((a,s)=>a+s.duration,0);const dist=p.scenes.reduce((sum,s,i)=>{if(i===0)return sum;return sum+s.positions.reduce((a,pt,j)=>a+Math.hypot(pt.x-p.scenes[i-1].positions[j].x,pt.y-p.scenes[i-1].positions[j].y),0)},0);return `<div class="compare-item"><h3>${p.name}</h3><div class="compare-stat"><span>场景数</span><strong>${p.scenes.length}</strong></div><div class="compare-stat"><span>总时长</span><strong>${d.toFixed(1)}s</strong></div><div class="compare-stat"><span>跑位总量</span><strong>${dist.toFixed(0)}格</strong></div><div class="compare-stat"><span>主要动作</span><strong>${[...new Set(p.scenes.map(s=>s.action))].join(' / ')}</strong></div></div>`}).join('');$('#compareDrawer').classList.add('open')}
$('#planSelect').onchange=e=>{state.activePlanId=e.target.value;state.activeScene=0;state.selectedPlayer=0;state.elapsed=0;renderAll()};$('#addPlayerBtn').onclick=()=>{const p=activePlan();const i=p.players.length;p.players.push({id:uid('p'),number:String(i+1),name:'新球员',role:'主攻',color:colors[i%colors.length],tag:'待设置'});p.scenes.forEach((s,j)=>s.positions.push({x:20+(i%3)*20+(j*2),y:12+(i%2)*28}));state.selectedPlayer=i;persist();renderAll();toast('已添加球员')};$('#applyPlayerBtn').onclick=applyPlayer;$('#addSceneBtn').onclick=addScene;$('#copySceneBtn').onclick=()=>{const p=activePlan(),src=deepClone(activeScene());src.id=uid('scene');src.name=src.name+' · 副本';p.scenes.splice(state.activeScene+1,0,src);state.activeScene++;persist();renderAll();toast('已复制当前场景')};$('#applyActionBtn').onclick=applyAction;$('#newPlanBtn').onclick=newPlan;$('#duplicateBtn').onclick=duplicatePlan;$('#saveBtn').onclick=()=>{persist();toast('方案已保存到本机')};$('#compareBtn').onclick=comparePlans;$('#closeCompareBtn').onclick=()=>$('#compareDrawer').classList.remove('open');$('#playBtn').onclick=()=>{state.playing=!state.playing;$('#playBtn').textContent=state.playing?'❚❚':'▶';if(state.playing)toast('开始播放跑位动画')};$('#stepBackBtn').onclick=()=>{state.playing=false;state.elapsed=Math.max(0,state.elapsed-.5);renderPlayback()};$('#stepForwardBtn').onclick=()=>{state.playing=false;state.elapsed=Math.min(totalDuration(),state.elapsed+.5);renderPlayback()};$('#speedSelect').onchange=e=>state.speed=+e.target.value;$('#loopBtn').onclick=()=>{state.loop=!state.loop;$('#loopBtn').textContent='循环：'+(state.loop?'开':'关')};$('#clearRoutesBtn').onclick=()=>{state.showRoutes=!state.showRoutes;$('#clearRoutesBtn').textContent=state.showRoutes?'隐藏轨迹':'显示轨迹';renderCourt()};$('#resetViewBtn').onclick=()=>{state.view='top';document.querySelectorAll('.view-switch button').forEach(b=>b.classList.toggle('active',b.dataset.view==='top'));$('#court').style.transform='';$('#court').style.filter='';toast('已重置视图')};document.querySelectorAll('.view-switch button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.view-switch button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');state.view=btn.dataset.view;const svg=$('#court');if(state.view==='depth'){svg.style.transform='perspective(800px) rotateX(53deg) rotateZ(-3deg) scale(1.02)';svg.style.filter='drop-shadow(0 28px 24px rgba(0,0,0,.42))'}else if(state.view==='flat'){svg.style.transform='perspective(800px) rotateX(18deg)';svg.style.filter='drop-shadow(0 20px 24px rgba(0,0,0,.35))'}else{svg.style.transform='';svg.style.filter='drop-shadow(0 18px 28px rgba(0,0,0,.32))'}});
ensureState();renderAll();requestAnimationFrame(tick);
</script>
</body>
</html>
